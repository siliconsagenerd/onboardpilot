services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - onboardpilot_data:/app/data
    environment:
      - APP_ENV=development
      - SECRET_KEY=${SECRET_KEY}
      - OPERATOR_AUTH_REQUIRED=true
      - DATABASE_URL=sqlite:////app/data/onboardpilot.db
      - SEED_ON_STARTUP=false
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  onboardpilot_data:
