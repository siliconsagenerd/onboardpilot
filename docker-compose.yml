services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - onboardpilot_data:/app/data
    environment:
      - SECRET_KEY=change-me-in-production
      - OPERATOR_AUTH_REQUIRED=true
      - DB_URL=sqlite:///./data/onboardpilot.db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  onboardpilot_data:
